<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <rect width="1200" height="300" rx="28" fill="#161F3C"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- Step 1: hotkey -->
    <g transform="translate(60,0)">
      <circle cx="18" cy="50" r="16" fill="#F9A51A"/>
      <text x="18" y="56" text-anchor="middle" font-size="17" font-weight="700" fill="#161F3C">1</text>
      <text x="46" y="57" font-size="22" font-weight="600" fill="#FFFFFF">Press the hotkey</text>
      <rect x="20" y="105" width="96" height="80" rx="14" fill="#232E55" stroke="#3A4778" stroke-width="2"/>
      <rect x="20" y="105" width="96" height="72" rx="14" fill="#2B3763"/>
      <text x="68" y="153" text-anchor="middle" font-size="34" font-weight="600" fill="#FFFFFF">⌥</text>
      <text x="138" y="153" text-anchor="middle" font-size="30" font-weight="600" fill="#8A93AD">+</text>
      <rect x="160" y="105" width="160" height="80" rx="14" fill="#232E55" stroke="#3A4778" stroke-width="2"/>
      <rect x="160" y="105" width="160" height="72" rx="14" fill="#2B3763"/>
      <text x="240" y="150" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF">Space</text>
      <text x="20" y="232" font-size="17" fill="#A9B0C4">Tap to start, or hold</text>
      <text x="20" y="256" font-size="17" fill="#A9B0C4">to talk. Works anywhere.</text>
    </g>

    <!-- arrow -->
    <path d="M412 145 h40 m-12 -12 l12 12 l-12 12" stroke="#F9A51A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Step 2: speak (recording pill) -->
    <g transform="translate(480,0)">
      <circle cx="18" cy="50" r="16" fill="#F9A51A"/>
      <text x="18" y="56" text-anchor="middle" font-size="17" font-weight="700" fill="#161F3C">2</text>
      <text x="46" y="57" font-size="22" font-weight="600" fill="#FFFFFF">Just talk</text>
      <rect x="20" y="118" width="230" height="54" rx="27" fill="#000000" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
      <circle cx="48" cy="145" r="6" fill="#FF453A"/>
      <g fill="#FFFFFF">
        <rect x="68"  y="139" width="5" height="12" rx="2.5"/>
        <rect x="80"  y="131" width="5" height="28" rx="2.5"/>
        <rect x="92"  y="125" width="5" height="40" rx="2.5"/>
        <rect x="104" y="133" width="5" height="24" rx="2.5"/>
        <rect x="116" y="128" width="5" height="34" rx="2.5"/>
        <rect x="128" y="137" width="5" height="16" rx="2.5"/>
        <rect x="140" y="130" width="5" height="30" rx="2.5"/>
        <rect x="152" y="124" width="5" height="42" rx="2.5"/>
        <rect x="164" y="134" width="5" height="22" rx="2.5"/>
        <rect x="176" y="139" width="5" height="12" rx="2.5"/>
        <rect x="188" y="132" width="5" height="26" rx="2.5"/>
        <rect x="200" y="137" width="5" height="16" rx="2.5"/>
        <rect x="212" y="140" width="5" height="10" rx="2.5"/>
      </g>
      <text x="20" y="232" font-size="17" fill="#A9B0C4">A small live waveform shows</text>
      <text x="20" y="256" font-size="17" fill="#A9B0C4">it's listening. Esc cancels.</text>
    </g>

    <!-- arrow -->
    <path d="M770 145 h40 m-12 -12 l12 12 l-12 12" stroke="#F9A51A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Step 3: text appears -->
    <g transform="translate(840,0)">
      <circle cx="18" cy="50" r="16" fill="#F9A51A"/>
      <text x="18" y="56" text-anchor="middle" font-size="17" font-weight="700" fill="#161F3C">3</text>
      <text x="46" y="57" font-size="22" font-weight="600" fill="#FFFFFF">Text appears</text>
      <rect x="20" y="95" width="290" height="100" rx="12" fill="#F2F2F4"/>
      <circle cx="38" cy="110" r="5" fill="#FF5F57"/>
      <circle cx="54" cy="110" r="5" fill="#FEBC2E"/>
      <circle cx="70" cy="110" r="5" fill="#28C840"/>
      <text x="36" y="148" font-size="17" fill="#1D1D1F">Sounds great, let's meet</text>
      <text x="36" y="174" font-size="17" fill="#1D1D1F">Thursday at noon.</text>
      <rect x="172" y="159" width="3" height="20" rx="1.5" fill="#F9A51A"/>
      <text x="20" y="232" font-size="17" fill="#A9B0C4">Punctuated text is typed into</text>
      <text x="20" y="256" font-size="17" fill="#A9B0C4">the app you're already in.</text>
    </g>
  </g>
</svg>
